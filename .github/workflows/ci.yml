name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'push' && fromJSON('["24","26"]') || fromJSON('["24"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for browser integration tests
        if: matrix.node == '24' || github.event_name == 'push'
        run: |
          pnpm exec playwright-core install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write('DSHPLUGIN_BROWSER_EXECUTABLE_PATH=' + chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Smoke the packed clean install
        if: matrix.node == '24'
        run: pnpm run smoke:pack
