name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for browser integration tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          pnpm exec playwright-core install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write('DSHPLUGIN_BROWSER_EXECUTABLE_PATH=' + chromium.executablePath() + '\n')" >> "$GITHUB_ENV"
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Smoke the packed clean install
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm run smoke:pack
